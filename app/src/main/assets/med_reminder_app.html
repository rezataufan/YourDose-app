<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pengingat Obat Dynamic-Interval</title>
  <style>
    :root {
      --bg: #f4f7f9;
      --surface: #ffffff;
      --text: #16222c;
      --muted: #5b6b79;
      --border: #dce4ec;
      --primary: #0d7a6f;
      --primary-hover: #095e55;
      --warn: #b45309;
      --warn-bg: #fef3c7;
      --danger: #b91c1c;
      --danger-bg: #fee2e2;
      --ok: #15803d;
      --ok-bg: #dcfce7;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding: 16px;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 1px 3px rgba(16, 24, 40, 0.04);
    }
    h1 { font-size: 1.25rem; margin: 0 0 4px 0; }
    h2 { font-size: 1rem; margin: 0 0 10px 0; }
    .sub { color: var(--muted); font-size: 0.875rem; margin: 0; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .between { justify-content: space-between; }
    label { font-size: 0.82rem; font-weight: 600; color: var(--muted); display: block; margin-bottom: 4px; }
    input[type="text"], input[type="number"], input[type="time"], input[type="date"] {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fff;
      color: var(--text);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }
    button {
      min-height: 40px;
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #e6edf3; color: var(--text); }
    .btn-warn { background: var(--warn-bg); color: var(--warn); border: 1px solid #fcd34d; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-sm { min-height: 32px; padding: 4px 10px; font-size: 0.8rem; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge-pending { background: #e0f2fe; color: #0369a1; }
    .badge-snoozed { background: var(--warn-bg); color: var(--warn); }
    .badge-taken { background: var(--ok-bg); color: var(--ok); }
    .badge-muted { background: #eef2f6; color: var(--muted); }
    .badge-strict { background: var(--danger-bg); color: var(--danger); }
    .alert {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      display: none;
    }
    .alert.show { display: block; }
    .alert-warn { background: var(--warn-bg); color: var(--warn); border: 1px solid #fcd34d; }
    .alert-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid #fca5a5; }
    .alert-ok { background: var(--ok-bg); color: var(--ok); border: 1px solid #86efac; }
    .dose-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .dose-item:last-child { margin-bottom: 0; }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 8px;
    }
    .checkbox-row input { width: 18px; height: 18px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="row between">
        <div>
          <h1>Pengingat Obat Dynamic-Interval</h1>
          <p class="sub">Jadwal bergeser otomatis mengikuti jam minum aktual</p>
        </div>
        <div class="row">
          <button id="btnUndo" class="btn-secondary" type="button">Undo</button>
          <button id="btnResetDemo" class="btn-secondary" type="button">Reset Demo</button>
        </div>
      </div>
      <div class="grid-2" style="margin-top: 12px;">
        <div>
          <label for="inputTanggalAktif">Tanggal Aktif</label>
          <input id="inputTanggalAktif" type="date" value="2026-11-16" />
        </div>
        <div>
          <label for="inputJamSimulasi">Jam Simulasi / Bangun Tidur</label>
          <input id="inputJamSimulasi" type="time" value="08:00" />
        </div>
      </div>
      <!-- ADDED: Temuan 2 - Tombol khusus Wake-Up Trigger untuk menyegarkan jadwal pagi -->
      <div style="margin-top: 10px;">
        <button id="btnApplyWake" class="btn-secondary btn-sm" type="button">Terapkan Jam Bangun (Wake-Up Trigger)</button>
      </div>
    </div>

    <div id="bannerSuccess" class="alert alert-ok"></div>
    <div id="bannerBentrok" class="alert alert-warn"></div>
    <div id="bannerError" class="alert alert-danger">
      <div id="errorPesan"></div>
      <div id="overrideBox" style="margin-top: 8px; display: none;">
        <button id="btnForceOverride" class="btn-danger" type="button">Paksa Catat (Override)</button>
      </div>
    </div>

    <div class="card">
      <h2>Antrean Jadwal Aktif (Kronologis)</h2>
      <div id="listAntrean"></div>
    </div>

    <div class="card">
      <h2>Semua Regimen &amp; Log Hari Ini</h2>
      <div id="listRegimen"></div>
    </div>

    <div class="card">
      <h2>Tambah Regimen Obat Baru</h2>
      <form id="formTambahObat">
        <div class="grid-2">
          <div>
            <label for="inputNamaObat">Nama Obat</label>
            <input id="inputNamaObat" type="text" placeholder="cth: Amoxicillin 500mg" required />
          </div>
          <div>
            <label for="inputDosisHari">Dosis per Hari</label>
            <input id="inputDosisHari" type="number" min="1" max="12" value="3" required />
          </div>
          <div>
            <label for="inputIntervalMenit">Interval (Menit)</label>
            <input id="inputIntervalMenit" type="number" min="15" value="240" required />
          </div>
          <div>
            <label for="inputMinGapMenit">Jarak Aman Min (Menit)</label>
            <input id="inputMinGapMenit" type="number" min="0" value="180" required />
          </div>
          <div>
            <label for="inputWakeTime">Target Pagi Paling Awal</label>
            <input id="inputWakeTime" type="time" value="07:00" required />
          </div>
          <div>
            <label for="inputSleepCutoff">Batas Jam Tidur</label>
            <input id="inputSleepCutoff" type="time" value="22:30" required />
          </div>
        </div>
        <div class="row" style="margin-top: 8px; gap: 18px;">
          <label class="checkbox-row">
            <input id="chkStrict" type="checkbox" />
            Mode Strict (Antibiotik: tetap bunyi lewat jam tidur)
          </label>
          <label class="checkbox-row">
            <input id="chkVibrate" type="checkbox" checked />
            Mode Getar Jam Kerja
          </label>
        </div>
        <div style="margin-top: 12px;">
          <button class="btn-primary" type="submit">Tambah ke Jadwal</button>
        </div>
      </form>
    </div>
  </div>

  <script src="dynamic_dose_scheduler.js"></script>
  <script src="medication_store.js"></script>
  <script>
    const STORAGE_KEY = "dynamic_dose_store_v1";
    let pendingOverride = null;

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function muatAtauInisialisasiStore() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          return imporStoreJSON(saved);
        } catch (_) {}
      }
      let s = buatStore("2026-11-16", "08:00");
      s = tambahObat(s, {
        id: "MED-AMOX",
        namaObat: "Amoxicillin 500mg",
        dosisPerHari: 3,
        intervalMenit: 480,
        minGapMenit: 360,
        earliestWakeTime: "07:00",
        sleepCutoffTime: "22:30",
        autoSnoozeMenit: 10,
        maxSnoozeCount: 3,
        silentVibrationOnly: false,
        strictInterval: true
      }).store;
      s = tambahObat(s, {
        id: "MED-PARA",
        namaObat: "Paracetamol 500mg",
        dosisPerHari: 4,
        intervalMenit: 240,
        minGapMenit: 180,
        earliestWakeTime: "07:00",
        sleepCutoffTime: "22:30",
        autoSnoozeMenit: 10,
        maxSnoozeCount: 3,
        silentVibrationOnly: true,
        strictInterval: false
      }).store;
      simpanStore(s);
      return s;
    }

    function simpanStore(s) {
      localStorage.setItem(STORAGE_KEY, eksporStoreJSON(s));
    }

    let appStore = muatAtauInisialisasiStore();

    // ADDED: Temuan 2 - Sinkronkan input kontrol tanggal & jam dari appStore
    function sinkronkanInputDariStore() {
      if (appStore.tanggalAktif) {
        document.getElementById("inputTanggalAktif").value = appStore.tanggalAktif;
      }
      if (appStore.wakeTimeAktual) {
        document.getElementById("inputJamSimulasi").value = appStore.wakeTimeAktual;
      }
    }

    // ADDED: Temuan 4 - Notifikasi status sukses singkat
    function tampilkanSukses(pesan) {
      const el = document.getElementById("bannerSuccess");
      el.textContent = pesan;
      el.classList.add("show");
    }

    function sembunyikanSukses() {
      document.getElementById("bannerSuccess").classList.remove("show");
    }

    function tampilkanError(pesan, overridePayload = null) {
      sembunyikanSukses();
      const el = document.getElementById("bannerError");
      document.getElementById("errorPesan").textContent = pesan;
      const box = document.getElementById("overrideBox");
      if (overridePayload) {
        pendingOverride = overridePayload;
        box.style.display = "block";
      } else {
        pendingOverride = null;
        box.style.display = "none";
      }
      el.classList.add("show");
    }

    function sembunyikanError() {
      pendingOverride = null;
      document.getElementById("bannerError").classList.remove("show");
    }

    function render() {
      const bentrok = deteksiBentrokJadwal(appStore, 15);
      const bannerBentrok = document.getElementById("bannerBentrok");
      if (bentrok.length > 0) {
        bannerBentrok.innerHTML =
          "<strong>Peringatan Jadwal Berdekatan:</strong> " +
          bentrok.map((b) => `${escapeHtml(b.obatA)} &amp; ${escapeHtml(b.obatB)} (selisih ${b.selisihMenit} mnt)`).join("; ");
        bannerBentrok.classList.add("show");
      } else {
        bannerBentrok.classList.remove("show");
      }

      // CHANGED: Temuan 1 - Gunakan data-* attributes (tanpa inline onclick) untuk event delegation
      const antrean = ambilAntreanJadwal(appStore);
      const listAntrean = document.getElementById("listAntrean");
      if (antrean.length === 0) {
        listAntrean.innerHTML = '<p class="sub">Semua dosis hari ini sudah selesai atau ditunda.</p>';
      } else {
        listAntrean.innerHTML = antrean.map((item) => {
          const badgeCls = item.alarmMode === "FORCE_SOUND" ? "badge-strict" : (item.status === "SNOOZED" ? "badge-snoozed" : "badge-pending");
          const jamSaja = item.waktuLabel.split(" ")[1] || "08:00";
          return `
            <div class="dose-item">
              <div>
                <strong>${escapeHtml(item.namaObat)}</strong> — Dosis #${item.dosisKe}<br/>
                <span class="sub">${escapeHtml(item.waktuLabel)}</span>
                <span class="badge ${badgeCls}">${escapeHtml(item.status)} · ${escapeHtml(item.alarmMode)}</span>
              </div>
              <div class="row">
                <button class="btn-primary" type="button" data-action="minum" data-med-id="${escapeHtml(item.medId)}" data-dosis="${item.dosisKe}">Minum</button>
                <button class="btn-warn" type="button" data-action="snooze" data-med-id="${escapeHtml(item.medId)}" data-dosis="${item.dosisKe}" data-jam="${escapeHtml(jamSaja)}">Snooze</button>
              </div>
            </div>`;
        }).join("");
      }

      // CHANGED: Temuan 4 - Tambah tombol Hapus per regimen obat dengan data-action="hapus"
      const listRegimen = document.getElementById("listRegimen");
      const entries = Object.entries(appStore.meds);
      if (entries.length === 0) {
        listRegimen.innerHTML = '<p class="sub">Belum ada regimen obat. Tambahkan melalui formulir di bawah.</p>';
      } else {
        listRegimen.innerHTML = entries.map(([medId, med]) => {
          const rows = med.jadwal.map((d) => {
            const stCls = d.status === "TAKEN" ? "badge-taken" : (d.status === "DEFERRED_SLEEP" || d.status === "MISSED" ? "badge-muted" : "badge-pending");
            return `<span class="badge ${stCls}" style="margin: 2px;">#${d.dosisKe}: ${escapeHtml(d.waktuTerjadwal)} (${escapeHtml(d.status)})</span>`;
          }).join("");
          return `
            <div style="padding: 10px 0; border-bottom: 1px solid var(--border);">
              <div class="row between">
                <div>
                  <strong>${escapeHtml(med.regimen.namaObat)}</strong>
                  ${med.regimen.strictInterval ? '<span class="badge badge-strict">STRICT</span>' : ""}
                </div>
                <button class="btn-secondary btn-sm" type="button" data-action="hapus" data-med-id="${escapeHtml(medId)}">Hapus</button>
              </div>
              <div style="margin-top: 6px;">${rows}</div>
            </div>`;
        }).join("");
      }
    }

    function aksiMinum(medId, dosisKe, forceOverride = false) {
      sembunyikanError();
      const tgl = document.getElementById("inputTanggalAktif").value;
      const jam = document.getElementById("inputJamSimulasi").value;
      const res = catatMinumObat(appStore, medId, dosisKe, tgl, jam, { forceOverride });
      if (!res.ok) {
        const bisaOverride = res.errorCode === "MIN_GAP_VIOLATION";
        tampilkanError(res.pesan, bisaOverride ? { medId, dosisKe } : null);
        return;
      }
      appStore = res.store;
      simpanStore(appStore);
      tampilkanSukses(`Dosis #${dosisKe} tercatat diminum pada ${tgl} ${jam}.`);
      render();
    }

    function aksiSnooze(medId, dosisKe, jamAlarm) {
      sembunyikanError();
      const res = snoozeObat(appStore, medId, dosisKe, jamAlarm);
      if (!res.ok) {
        tampilkanError(res.pesan);
        return;
      }
      appStore = res.store;
      simpanStore(appStore);
      tampilkanSukses(`Dosis #${dosisKe} di-snooze (+10 menit).`);
      render();
    }

    // ADDED: Temuan 4 - Hapus regimen obat dari store
    function aksiHapusObat(medId) {
      sembunyikanError();
      if (!appStore.meds[medId]) return;
      const nama = appStore.meds[medId].regimen.namaObat;
      const nextStore = JSON.parse(JSON.stringify(appStore));
      delete nextStore.meds[medId];
      appStore = nextStore;
      simpanStore(appStore);
      tampilkanSukses(`Regimen "${nama}" dihapus.`);
      render();
    }

    // ADDED: Temuan 1 - Event delegation pada #listAntrean & #listRegimen
    document.getElementById("listAntrean").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;
      const action = btn.getAttribute("data-action");
      const medId = btn.getAttribute("data-med-id");
      const dosisKe = Number(btn.getAttribute("data-dosis"));
      if (action === "minum") {
        aksiMinum(medId, dosisKe, false);
      } else if (action === "snooze") {
        aksiSnooze(medId, dosisKe, btn.getAttribute("data-jam"));
      }
    });

    document.getElementById("listRegimen").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-action='hapus']");
      if (!btn) return;
      aksiHapusObat(btn.getAttribute("data-med-id"));
    });

    // ADDED: Temuan 2 - Terapkan Wake-Up Trigger baru untuk obat yang belum diminum sama sekali
    document.getElementById("btnApplyWake").addEventListener("click", () => {
      sembunyikanError();
      try {
        const tgl = document.getElementById("inputTanggalAktif").value;
        const wake = document.getElementById("inputJamSimulasi").value;
        let nextStore = buatStore(tgl, wake);
        let diperbarui = 0;
        for (const [medId, med] of Object.entries(appStore.meds)) {
          const adaTaken = med.jadwal.some((d) => d.status === "TAKEN");
          if (adaTaken) {
            nextStore.meds[medId] = med;
          } else {
            nextStore = tambahObat(nextStore, med.regimen, tgl, wake).store;
            diperbarui++;
          }
        }
        nextStore.history = appStore.history || [];
        appStore = nextStore;
        simpanStore(appStore);
        tampilkanSukses(`Wake-Up Trigger diterapkan (${tgl} ${wake}) untuk ${diperbarui} regimen aktif.`);
        render();
      } catch (err) {
        tampilkanError(err.message);
      }
    });

    document.getElementById("btnForceOverride").addEventListener("click", () => {
      if (pendingOverride) {
        aksiMinum(pendingOverride.medId, pendingOverride.dosisKe, true);
      }
    });

    document.getElementById("btnUndo").addEventListener("click", () => {
      sembunyikanError();
      const res = undoTerakhir(appStore);
      if (!res.ok) {
        tampilkanError(res.pesan);
        return;
      }
      appStore = res.store;
      simpanStore(appStore);
      tampilkanSukses(`Aksi terakhir dibatalkan: ${res.undoneAction}`);
      render();
    });

    document.getElementById("btnResetDemo").addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      sembunyikanError();
      appStore = muatAtauInisialisasiStore();
      sinkronkanInputDariStore(); // CHANGED: Temuan 2
      tampilkanSukses("Data demo direset ke kondisi awal.");
      render();
    });

    document.getElementById("formTambahObat").addEventListener("submit", (e) => {
      e.preventDefault();
      sembunyikanError();
      try {
        // CHANGED: Temuan 3 - Validasi namaObat tidak boleh kosong/spasi saja
        const namaInput = document.getElementById("inputNamaObat");
        const namaObat = namaInput.value.trim();
        if (!namaObat) {
          tampilkanError("Nama obat tidak boleh kosong.");
          return;
        }

        const regimen = {
          namaObat,
          dosisPerHari: Number(document.getElementById("inputDosisHari").value),
          intervalMenit: Number(document.getElementById("inputIntervalMenit").value),
          minGapMenit: Number(document.getElementById("inputMinGapMenit").value),
          earliestWakeTime: document.getElementById("inputWakeTime").value,
          sleepCutoffTime: document.getElementById("inputSleepCutoff").value,
          autoSnoozeMenit: 10,
          maxSnoozeCount: 3,
          silentVibrationOnly: document.getElementById("chkVibrate").checked,
          strictInterval: document.getElementById("chkStrict").checked
        };
        const tgl = document.getElementById("inputTanggalAktif").value;
        const wake = document.getElementById("inputJamSimulasi").value;
        const res = tambahObat(appStore, regimen, tgl, wake);
        if (!res.ok) {
          tampilkanError(res.pesan);
          return;
        }
        appStore = res.store;
        simpanStore(appStore);
        namaInput.value = ""; // CHANGED: Temuan 3 - hanya kosongkan nama obat agar preferensi jam tetap terjaga
        tampilkanSukses(`Regimen "${namaObat}" ditambahkan.`);
        render();
      } catch (err) {
        tampilkanError(err.message);
      }
    });

    sinkronkanInputDariStore(); // CHANGED: Temuan 2
    render();
  </script>
</body>
</html>
