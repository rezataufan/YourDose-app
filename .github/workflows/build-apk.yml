name: Build Android APK (Dynamic Dose Scheduler)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run JS Core, Store, UI, Alarm, & E2E Harnesses
        run: |
          node tests/harness_step1_engine.js
          node tests/harness_step2_store.js
          node tests/harness_step3_ui.js
          node tests/harness_step4_alarm_sim.js
          node tests/harness_step5_e2e.js

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Android Unit Tests
        run: gradle testDebugUnitTest

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-dose-debug-apk
          path: app/build/outputs/apk/debug/*.apk
